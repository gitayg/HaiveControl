[package]
name = "it-ai-hub"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "it-ai-hub"
path = "src/main.rs"

[dependencies]
tiny_http = "0.12"
mdns-sd = "0.11"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
base64 = "0.22"
uuid = { version = "1", features = ["v5"] }
flate2 = "1"
rcgen = { version = "0.13", features = ["x509-parser"] }
sha2 = "0.10"
# Capability tokens (capability.rs): ed25519 over a compact JSON payload, and
# raw OS entropy for the signing seed + per-token nonce. Deliberately a separate
# algorithm/key from the rcgen CA (ECDSA P-256), which the agent cannot verify.
ed25519-dalek = "2"
getrandom = "0.2"
